<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080709">
  <title>Screenshot Card Review — Wetin Be Dis</title>
  <style>
    :root{--ink:#080709;--panel:#171319;--paper:#fff4d8;--gold:#ffb100;--muted:#bdb4bc;--line:rgba(255,177,0,.28)}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 0 0,rgba(67,18,123,.75),transparent 35%),radial-gradient(circle at 100% 20%,rgba(24,166,64,.24),transparent 32%),var(--ink);color:var(--paper);font:16px/1.45 Arial,Helvetica,sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:radial-gradient(#fff .55px,transparent .7px);background-size:5px 5px}.wrap{width:min(1180px,100%);margin:auto;padding:24px clamp(16px,4vw,58px) 80px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}.brand{color:var(--paper);text-decoration:none;font-weight:950;line-height:.9}.back{color:var(--gold);font-weight:800}.eyebrow{color:var(--gold);font-size:12px;font-weight:950;letter-spacing:4px}.title h1{font:700 clamp(38px,7vw,72px)/.95 Georgia,serif;letter-spacing:-3px;margin:10px 0 14px}.title p{color:#d4ccd5;max-width:760px}.panel,.card{background:rgba(23,19,25,.97);border:1px solid var(--line);border-radius:16px;padding:16px}.panel{margin-top:22px}.stats{color:var(--muted);margin-bottom:14px}.stats strong{color:var(--gold);font-size:22px}.actions{display:flex;gap:10px;flex-wrap:wrap}.button{min-height:46px;border-radius:10px;padding:0 16px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.07);color:var(--paper);font:850 14px Arial;cursor:pointer}.button.primary{color:#080709;background:linear-gradient(110deg,var(--gold),#ffd05b);border:0}.status{color:var(--muted);align-self:center;font-size:14px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:20px}.card{display:grid;gap:12px}.head{display:flex;align-items:center;gap:9px}.number{color:#080709;background:var(--gold);border-radius:8px;padding:4px 8px;font-weight:950}.id{color:var(--muted);font:12px ui-monospace,SFMono-Regular,Menlo,monospace}.field{display:grid;gap:6px;color:#d9d2da;font-size:13px;font-weight:850}.field input,.field select{width:100%;min-height:44px;border:1px solid rgba(255,255,255,.2);border-radius:10px;background:#0c0b0d;color:var(--paper);padding:0 12px;font:inherit}.field input:focus,.field select:focus{outline:2px solid var(--gold);outline-offset:1px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.forbidden{border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:10px;display:grid;gap:10px}.forbidden legend{padding:0 6px;color:var(--gold);font-size:12px;font-weight:950;letter-spacing:1px;text-transform:uppercase}.empty{padding:32px;text-align:center;color:var(--muted)}@media(max-width:700px){.cards{grid-template-columns:1fr}.two{grid-template-columns:1fr}.button{flex:1}.title h1{letter-spacing:-2px}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top"><a class="brand" href="/">WETIN<br>BE DIS</a><a class="back" href="/card-review">Full deck</a></div>
    <section class="title"><div class="eyebrow">SCREENSHOT CARD REVIEW</div><h1>Review these cards.</h1><p>These are the remaining cards from your screenshots. Edit the answer, category, difficulty, or forbidden words, then download the JSON and send it back.</p></section>
    <section class="panel"><div class="stats"><strong id="count">0</strong> cards in this review set</div><div class="actions"><button class="button primary" id="download">Download edited JSON</button><button class="button" id="reset">Reset to Site version</button><span class="status" id="status">Loading…</span></div></section>
    <section id="cards" class="cards" aria-live="polite"></section><div id="empty" class="empty" hidden>Cards could not be loaded.</div>
  </main>
  <script>
    (()=>{const key="wetin-be-dis-screenshot-review-v1",$=id=>document.getElementById(id),state={cards:[]};
      const categories=["Celebrities","Culture","Diaspora","Food","Music","Naija Life","Nollywood","Religion","School","Slang","Celebrations","Trending Now"], difficulties=["Easy","Medium","Hard"];
      const setStatus=(text,good=false)=>{const n=$("status");n.textContent=text;n.style.color=good?"#8ee8a7":""};
      const local=()=>{try{const v=JSON.parse(localStorage.getItem(key)||"null");return Array.isArray(v)?v:null}catch{return null}};
      const saveLocal=()=>localStorage.setItem(key,JSON.stringify(state.cards));
      const update=(card,field,value)=>{card[field]=value;saveLocal();setStatus("Unsaved changes")};
      const field=(label,value,onInput,options)=>{const l=document.createElement("label");l.className="field";l.textContent=label;const i=options?document.createElement("select"):document.createElement("input");if(options)options.forEach(v=>{const o=document.createElement("option");o.textContent=v;o.value=v;o.selected=v===value;i.append(o)});else i.value=value;i.addEventListener("input",()=>onInput(i.value));l.append(i);return l};
      const render=()=>{const root=$("cards");root.replaceChildren();$("count").textContent=state.cards.length;state.cards.forEach(card=>{const a=document.createElement("article");a.className="card";const h=document.createElement("div");h.className="head";const n=document.createElement("span");n.className="number";n.textContent="#"+card["Card Number"];const id=document.createElement("span");id.className="id";id.textContent=card.ID;h.append(n,id);a.append(h);a.append(field("Answer",card["Main Word"],v=>update(card,"Main Word",v)));const two=document.createElement("div");two.className="two";two.append(field("Category",card.Category,v=>update(card,"Category",v),categories),field("Difficulty",card.Difficulty,v=>update(card,"Difficulty",v),difficulties));a.append(two);const fs=document.createElement("fieldset");fs.className="forbidden";const legend=document.createElement("legend");legend.textContent="Forbidden words";fs.append(legend);[1,2,3].forEach(i=>fs.append(field("Forbidden "+i,card["Forbidden Word "+i],v=>update(card,"Forbidden Word "+i,v))));a.append(fs);root.append(a)})};
      const load=async(reset=false)=>{try{const v=reset?null:local();const data=v||await (await fetch("/screenshot-cards-to-edit.json",{cache:"no-store"})).json();state.cards=data.map(c=>({...c}));render();setStatus(v?"Using your saved edits":"Site version loaded",true)}catch{setStatus("Cards could not be loaded");$("empty").hidden=false}};
      $("download").addEventListener("click",()=>{const b=new Blob([JSON.stringify(state.cards,null,2)],{type:"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="screenshot-cards-to-edit.json";a.click();URL.revokeObjectURL(u);setStatus("JSON downloaded",true)});
      $("reset").addEventListener("click",()=>{localStorage.removeItem(key);load(true)});load();
    })();
  </script>
</body>
</html>
